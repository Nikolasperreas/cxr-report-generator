# Step 1.2: small CNN from scratch (SmallCNN, src/models/encoders.py), with augmentation, no flip.
# Mini-batch training with Adam; the kept model is the epoch with the lowest val loss.
seed: 42  # passed to set_seeds
image_size: 224  # every X-ray is squashed to image_size x image_size grayscale
channels: [16, 32, 64, 128, 256]  # out-channels of each conv block, one block per entry
batch_size: 32  # images per weight update
learning_rate: 0.001  # Adam's step size; write 0.001, not 1e-3 (YAML reads 1e-3 as text)
epochs: 60  # passes over the training set
threshold: 0.5  # probability at or above which the model says "yes"

augmentation:  # train images only; val and test are never augmented
  rotation_degrees: 10  # random angle in [-10, 10]: patients don't stand perfectly straight
  translate: 0.05  # random shift up to 5% of width and height: positioning varies
  scale: [0.9, 1.1]  # random zoom: distance from the detector, body size
  brightness: 0.2  # every pixel x a factor in [0.8, 1.2]: exposure differs between machines
  contrast: 0.2  # contrast factor in [0.8, 1.2]
  horizontal_flip: false  # the heart is on the left; only the flip run sets this to true
